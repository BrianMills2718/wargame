[project]
name = "wargame"
version = "0.1.0"
description = "Generative AI geopolitical wargame — hybrid programmatic state engine + LLM adjudication"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "llm-client>=0.7.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
    "matplotlib>=3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wargame*"]

[dependency-groups]
dev = ["agentic-engineering-system", "pytest>=9.1", "import-linter>=2.15"]

[tool.uv.sources]
agentic-engineering-system = { git = "https://github.com/BrianMills2718/agentic-engineering-system-canonical", rev = "05ee80c1a9cc77f692954b6de09a81ab0d9bdb0a" }

[tool.lockstep]
source = ["wargame"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
